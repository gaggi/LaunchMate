name: Tests

# Builds and tests every push to main on the same runner as the release workflow,
# so a release tag only needs to be set on a commit that already passed here.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # The CMake presets intentionally target Visual Studio 2022.
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure CMake x64
        run: cmake --preset vs2022-x64

      - name: Build Release x64
        run: cmake --build --preset build-vs2022-x64-release

      - name: Configure CMake x86
        run: cmake --preset vs2022-x86

      - name: Build Release x86
        run: cmake --build --preset build-vs2022-x86-release

      - name: Run tests x64
        shell: pwsh
        run: |
          foreach ($test in 'LaunchMateCoreTests', 'LaunchMateUpdateTests') {
            $output = & ".\build\vs2022-x64\Release\$test.exe" 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) {
              # Failed checks go to stderr; as annotations they show on the run page.
              $errors = $output | Where-Object { $_ -is [System.Management.Automation.ErrorRecord] }
              if (-not $errors) { $errors = @("exit code $code") }
              $errors | ForEach-Object { Write-Host "::error title=$test (x64)::$_" }
              exit $code
            }
          }

      - name: Run tests x86
        shell: pwsh
        run: |
          foreach ($test in 'LaunchMateCoreTests', 'LaunchMateUpdateTests') {
            $output = & ".\build\vs2022-x86\Release\$test.exe" 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) {
              # Failed checks go to stderr; as annotations they show on the run page.
              $errors = $output | Where-Object { $_ -is [System.Management.Automation.ErrorRecord] }
              if (-not $errors) { $errors = @("exit code $code") }
              $errors | ForEach-Object { Write-Host "::error title=$test (x86)::$_" }
              exit $code
            }
          }
