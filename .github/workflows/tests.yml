name: Tests

# Builds and tests every push to main on the same runner as the release workflow,
# so a release tag only needs to be set on a commit that already passed here.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # The CMake presets intentionally target Visual Studio 2022.
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure CMake x64
        run: cmake --preset vs2022-x64

      - name: Build Release x64
        run: cmake --build --preset build-vs2022-x64-release

      - name: Configure CMake x86
        run: cmake --preset vs2022-x86

      - name: Build Release x86
        run: cmake --build --preset build-vs2022-x86-release

      - name: Run tests x64
        shell: pwsh
        run: |
          & .\build\vs2022-x64\Release\LaunchMateCoreTests.exe; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\build\vs2022-x64\Release\LaunchMateUpdateTests.exe; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests x86
        shell: pwsh
        run: |
          & .\build\vs2022-x86\Release\LaunchMateCoreTests.exe; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\build\vs2022-x86\Release\LaunchMateUpdateTests.exe; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
